name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify signed release tag
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" "+refs/heads/main:refs/remotes/origin/main"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "${TAG}^{commit}")" ]; then
            echo "::error::checked-out commit $(git rev-parse HEAD) is not the commit $TAG points at"
            exit 1
          fi
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "::error::$TAG is a lightweight tag; release tags must be annotated and signed (git tag -s)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${TAG}^{commit}" origin/main; then
            echo "::error::$TAG does not point at a commit on main"
            exit 1
          fi
          signers="$RUNNER_TEMP/release-signers"
          git show origin/main:.github/release-signers > "$signers"
          if ! git -c gpg.ssh.allowedSignersFile="$signers" verify-tag "$TAG"; then
            echo "::error::$TAG is not signed by an authorized release signer"
            exit 1
          fi
          tagger_email="$(git for-each-ref --format='%(taggeremail:trim)' "refs/tags/${TAG}")"
          case "$tagger_email" in
            *@users.noreply.github.com) ;;
            *)
              echo "::error::$TAG tagger email is not a GitHub noreply address; delete the tag and re-tag with a users.noreply.github.com user.email (RELEASE.md)"
              exit 1
              ;;
          esac
      - name: No GitHub release may exist for the tag yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a GitHub release for $TAG already exists; publish.yml creates it after PyPI, and releases are immutable (RELEASE.md)"
            exit 1
          fi
      - name: Tag must match the package version and have a CHANGELOG entry
        run: |
          version="$(python3 -I -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version v${version}"
            exit 1
          fi
          if ! grep -qxF "### ${version}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '### ${version}' heading; rename '### Unreleased' to it in the SDK source before releasing"
            exit 1
          fi

  release-audit:
    name: Release audit
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-audit
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-audit
          path: |
            release/
            requirements.lock
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}

  build:
    name: Build distribution
    needs: [verify, release-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --require-hashes -r requirements-release.txt
      - name: Build sdist and wheel
        env:
          PIP_CONSTRAINT: build-constraints.txt
        run: python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/switch-trust-sdk-py/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  github-release:
    name: Create the GitHub release with audit reports
    needs: [verify, release-audit, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download audit reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-audit
          path: audit/
      - name: Create the release with the audit reports
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files=(audit/release/* audit/requirements.lock)
          gh release create "$TAG" "${files[@]}" --verify-tag --title "$TAG" --generate-notes -R "$GITHUB_REPOSITORY"
